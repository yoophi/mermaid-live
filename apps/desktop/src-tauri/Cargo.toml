[package]
name = "mermaid-live"
version = "2026.8.1"
description = "Mermaid Live desktop application"
authors = ["yoophi"]
edition = "2021"

[lib]
name = "mermaid_live_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
serde_json = "1.0"
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
arboard = "3.4"
md5 = "0.7"
percent-encoding = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.5.1", features = [] }
tauri-plugin-dialog = "2.7.1"
thiserror = "2.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSResponder", "NSApplication"] }
