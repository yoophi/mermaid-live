[package]
name = "mermaid-live"
version = "0.1.0"
description = "Mermaid Live desktop application"
authors = ["yoophi"]
edition = "2021"

[lib]
name = "mermaid_live_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.5.1", features = [] }
thiserror = "2.0"
