[workspace]
resolver = "2"
members = ["mermaid-core", "mmdcat"]

# Kept outside the desktop app's workspace on purpose: the app has a large
# build cache, and sharing a workspace would relocate its target directory and
# force a full rebuild. `mermaid-core` is reached from the app by path instead.
[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["yoophi"]

[workspace.dependencies]
base64 = "0.22"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
